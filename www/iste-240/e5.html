<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Exercise 5</title>

		<link rel="stylesheet" href="knickknacks/attire/e5.css">
		<script
			defer
			type="module"
			src="knickknacks/manuscripts/e5.js"
		></script>
	</head>

	<body>
		<h1>Exercise 5</h1>
		<hr>
		<article id="sectionA">
			<h2>JavaScript Exercise 5a</h2>
			<p>
				This style of this paragraph will change when you click the
				button below.
			</p>
			<button id="changeStyleButton">Change Style</button>
			<button id="moveTextButton">Move Text</button>
		</article>
		<hr>
		<article id="sectionB">
			<h2>JavaScript Exercise 5b</h2>
			<form>
				<label> First name: <input name="first" value="Boo"> </label>
				<label> Last name: <input name="last" value="Radley"> </label>
				<label> Has dog: <input name="dog" type="checkbox"> </label>
				<label> Major: <input name="major"> </label>
				<button>Read Name</button>
				<button type="button" id="inputCountButton">Count of inputs</button>
			</form>
		</article>
		<hr>
		<article id="sectionC">
			<h2>JavaScript Exercise 5c</h2>
			<select name="color">
				<option>Red</option>
				<option>Green</option>
				<option>Blue</option>
				<option>Yellow</option>
				<option>Orange</option>
				<option>Purple</option>
			</select>
			<button>Color Changer</button>
		</article>
		<hr>
		<article id="sectionD">
			<h2>JavaScript Exercise 5d</h2>
			<p>
				This sentence will turn red when you mouseover it.
			</p>
		</article>
		<hr>
		<article id="sectionE">
			<h2>JavaScript Exercise 5e</h2>
			<form>
				<label>
					First Operand:
					<input type="number" name="first" value="12" required>
				</label>
				<label>
					Second Operand:
					<input type="number" name="second" value="3" required>
				</label>

				<button data-operator="/">Divide</button>
				<button data-operator="*">Multiply</button>
				<output> The result is: <span></span> </output>
			</form>
		</article>
	</body>
</html>
